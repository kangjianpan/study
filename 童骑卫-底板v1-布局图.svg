  <circle class="corepad" cx="594" cy="368" r="5"/>
  <circle class="corepad" cx="614" cy="368" r="5"/>
  <circle class="corepad" cx="634" cy="368" r="5"/>

  <!-- pin1 标记 -->
  <circle class="pad1" cx="234" cy="246" r="5"/>

  <text class="t-white" x="380" y="300">③ 核心板座 J2A / J2B</text>
  <text class="t-whiteS" x="368" y="316">53.34 × 22.86 mm · J2A 上排 / J2B 下排</text>
  <text class="t-whiteS" x="368" y="330">排距 15.24 mm · 红色 = PIN1</text>
  <text class="t-pin" x="236" y="232">G</text>
  <text class="t-pin" x="626" y="232">VB</text>
  <text class="t-pin" x="236" y="392">B12</text>
  <text class="t-pin" x="618" y="392">3.3</text>

  <!-- ================= ⑤ ADC 前端 ================= -->
  <rect class="comp-adc" x="26" y="436" width="66" height="20" rx="2"/>
  <text class="t-sub" x="32" y="450">R10/R11</text>

  <rect class="comp-adc" x="98" y="436" width="30" height="20" rx="2"/>
  <text class="t-sub" x="104" y="450">D5</text>

  <rect class="comp-adc" x="134" y="436" width="30" height="20" rx="2"/>
  <text class="t-sub" x="140" y="450">C8</text>

  <rect class="conn" x="26" y="466" width="92" height="48" rx="3"/>
  <text class="t-sub" x="32" y="486">J16 电流模组</text>
  <text class="t-sub" x="32" y="504">3P 排母</text>

  <rect class="conn" x="130" y="466" width="92" height="48" rx="3"/>
  <text class="t-sub" x="136" y="486">J6 油门踏板</text>
  <text class="t-sub" x="136" y="504">3P 端子</text>

  <rect class="conn" x="26" y="522" width="92" height="48" rx="3"/>
  <text class="t-sub" x="32" y="542">J7 坐垫 FSR</text>
  <text class="t-sub" x="32" y="560">3P 端子</text>

  <rect class="conn" x="130" y="522" width="92" height="48" rx="3"/>
  <text class="t-sub" x="136" y="542">J5 安全带</text>
  <text class="t-sub" x="136" y="560">3P 端子 5V</text>

  <rect class="comp-adc" x="26" y="576" width="52" height="18" rx="2"/>
  <text class="t-sub" x="32" y="589">D6–D8</text>
  <text class="t-whiteS" x="86" y="589">BAT54S 钳位 ×4</text>

  <!-- ================= ④ 电机 / 轮速 ================= -->
  <rect class="conn" x="290" y="432" width="86" height="32" rx="3"/>
  <text class="t-sub" x="296" y="449">J3 电调</text>
  <text class="t-sub" x="296" y="460">3P 排针</text>

  <rect class="comp-pwr" x="384" y="438" width="34" height="20" rx="2"/>
  <text class="t-sub" x="386" y="452" fill="#b03030">R4↓</text>

  <rect class="conn" x="290" y="476" width="62" height="48" rx="3"/>
  <text class="t-sub" x="296" y="496">J4 急停</text>
  <text class="t-sub" x="296" y="514">2P 端子</text>

  <rect class="comp-pwr" x="362" y="482" width="34" height="20" rx="2"/>
  <text class="t-sub" x="364" y="496" fill="#b03030">R5↑</text>

  <rect class="conn" x="290" y="534" width="62" height="48" rx="3"/>
  <text class="t-sub" x="296" y="554">J14 蜂鸣</text>
  <text class="t-sub" x="296" y="572">2P 端子</text>

  <rect class="comp" x="364" y="520" width="30" height="28" rx="2"/>
  <text class="t-sub" x="368" y="538">Q2</text>

  <rect class="conn" x="424" y="432" width="92" height="48" rx="3"/>
  <text class="t-sub" x="430" y="452">J8 霍尔 左</text>
  <text class="t-sub" x="430" y="470">3P 端子 5V</text>

  <rect class="conn" x="424" y="496" width="92" height="48" rx="3"/>
  <text class="t-sub" x="430" y="516">J9 霍尔 右</text>
  <text class="t-sub" x="430" y="534">3P 端子 5V</text>

  <rect class="comp-adc" x="424" y="520" width="60" height="28" rx="2"/>
  <text class="t-sub" x="428" y="532">R6/R7</text>
  <text class="t-sub" x="428" y="544">上拉</text>

  <text class="t-whiteS" x="292" y="596">PB12 = MOTOR_EN（必须下拉）  PB15 = ESTOP（必须上拉）</text>

  <!-- ================= ⑥ 扩展排针 ================= -->
  <rect class="conn" x="580" y="432" width="82" height="32" rx="3"/>
  <text class="t-sub" x="586" y="449">J10 ESP32</text>
  <text class="t-sub" x="586" y="460">4P 排母</text>

  <rect class="conn" x="580" y="472" width="82" height="32" rx="3"/>
  <text class="t-sub" x="586" y="489">J11 I2C</text>
  <text class="t-sub" x="586" y="500">4P 排母</text>

  <rect class="conn" x="580" y="512" width="124" height="32" rx="3"/>
  <text class="t-sub" x="586" y="529">J12 SPI</text>
  <text class="t-sub" x="586" y="540">6P 排母</text>

  <rect class="conn" x="716" y="432" width="62" height="32" rx="3"/>
  <text class="t-sub" x="720" y="449">J13 XSHUT</text>
  <text class="t-sub" x="720" y="460">3P 排母</text>

  <rect class="comp" x="716" y="476" width="44" height="22" rx="2"/>
  <text class="t-sub" x="722" y="491">D4</text>
  <text class="t-whiteS" x="766" y="491">⑦ 心跳灯</text>

  <rect class="comp" x="716" y="508" width="60" height="46" rx="4"/>
  <text class="t-sub" x="722" y="536">SW1</text>
  <text class="t-whiteS" x="782" y="536">⑦ 复位</text>

  <text class="t-whiteS" x="580" y="570">J10: 5V / TX / RX / GND  →  ESP32-C3</text>

  <!-- ================= 尺寸 ================= -->
  <line class="dim" x1="0" y1="690" x2="880" y2="690"/>
  <line class="dim" x1="0" y1="682" x2="0" y2="698"/>
