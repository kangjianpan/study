  <circle class="corepad" cx="289" cy="368" r="5"/>
  <circle class="corepad" cx="309" cy="368" r="5"/>
  <circle class="corepad" cx="329" cy="368" r="5"/>
  <circle class="corepad" cx="350" cy="368" r="5"/>
  <circle class="corepad" cx="370" cy="368" r="5"/>
  <circle class="corepad" cx="390" cy="368" r="5"/>
  <circle class="corepad" cx="411" cy="368" r="5"/>
  <circle class="corepad" cx="431" cy="368" r="5"/>
  <circle class="corepad" cx="451" cy="368" r="5"/>
  <circle class="corepad" cx="472" cy="368" r="5"/>
  <circle class="corepad" cx="492" cy="368" r="5"/>
  <circle class="corepad" cx="512" cy="368" r="5"/>
  <circle class="corepad" cx="533" cy="368" r="5"/>
  <circle class="corepad" cx="553" cy="368" r="5"/>
