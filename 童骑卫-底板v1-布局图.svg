<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -70 960 810" width="960" height="810"
     font-family="Microsoft YaHei, PingFang SC, sans-serif">

  <defs>
    <style>
      .board    { fill: #1b6e3c; stroke: #0d3d21; stroke-width: 3; }
      .hole     { fill: #0d3d21; stroke: #ffffff; stroke-width: 1.5; stroke-opacity: .55; }
      .comp     { fill: #e8f0e8; stroke: #2a5a3a; stroke-width: 1.4; }
      .comp-pwr { fill: #ffe3e3; stroke: #b03030; stroke-width: 1.4; }
      .comp-dcdc{ fill: #fff0d6; stroke: #b07010; stroke-width: 1.4; }
      .comp-com { fill: #e6e0f8; stroke: #6a4fa8; stroke-width: 1.4; }
      .comp-adc { fill: #dff2e6; stroke: #207a48; stroke-width: 1.4; }
      .conn     { fill: #ffd9b0; stroke: #a05a10; stroke-width: 1.6; }
      .core     { fill: #14213d; stroke: #0a1224; stroke-width: 2; }
      .corepad  { fill: #f0c419; }
      .pad1     { fill: #ff5a3c; }
      .t-main   { font-size: 10px; font-weight: 700; fill: #1a2a20; }
      .t-sub    { font-size: 8px;  fill: #4a5a50; }
      .t-white  { font-size: 10px; font-weight: 700; fill: #ffffff; }
      .t-whiteS { font-size: 8px;  fill: #c8d8cc; }
      .t-pin    { font-size: 9px;  font-weight: 700; fill: #ffffff; }
      .zone     { fill: none; stroke: #ffffff; stroke-width: 1.2; stroke-dasharray: 6 5; opacity: .5; }
      .ztitle   { fill: #ffffff; font-size: 11px; font-weight: 700; }
      .dim      { stroke: #444; stroke-width: 1; fill: none; }
      .dimtxt   { fill: #333; font-size: 11px; }
      .title    { fill: #103018; font-size: 18px; font-weight: 700; }
      .sub      { fill: #556; font-size: 11px; }
      .note     { fill: #a04020; font-size: 11px; font-weight: 700; }
    </style>
  </defs>

  <text class="title" x="0" y="-40">童骑卫 · 底板 v1 布局图</text>
  <text class="sub" x="0" y="-22">板框 110 × 80 mm · 核心板 TLS-STM32F103C8 · 2 条 1×20 排母（排距 15.24） · 比例 8 px = 1 mm</text>
  <text class="note" x="0" y="-6">※ 这是布局示意图，用来在 LCEDA 里对位摆件；不能直接投产，覆铜/走线/DRC 必须在 EDA 里做</text>

  <!-- ================= 板框 ================= -->
  <rect class="board" x="0" y="0" width="880" height="640" rx="10"/>


  <!-- ================= 分区 ================= -->
  <rect class="zone" x="16" y="18" width="184" height="182"/>
  <rect class="zone" x="212" y="18" width="328" height="182"/>
  <rect class="zone" x="552" y="18" width="312" height="182"/>
  <rect class="zone" x="16" y="412" width="254" height="188"/>
  <rect class="zone" x="282" y="412" width="278" height="188"/>
  <rect class="zone" x="572" y="412" width="292" height="188"/>

  <text class="ztitle" x="48" y="32">① 输入保护</text>
  <text class="ztitle" x="218" y="32">② DC-DC  24V → 5V / 3A</text>
  <text class="ztitle" x="558" y="32">⑥ 通信 / USB</text>
  <text class="ztitle" x="22" y="426">⑤ ADC 前端</text>
  <text class="ztitle" x="288" y="426">④ 电机接口</text>
  <text class="ztitle" x="578" y="426">⑥ 通信 / 扩展</text>

  <!-- ================= ① 输入保护 ================= -->
  <rect class="conn" x="26" y="42" width="80" height="138" rx="4"/>
  <text class="t-main" x="42" y="104">J1</text>
  <text class="t-sub"  x="38" y="120">24V 输入</text>
  <text class="t-sub"  x="34" y="134">KF128-2P</text>

  <rect class="comp-pwr" x="116" y="42" width="72" height="32" rx="2"/>
  <text class="t-main" x="126" y="56">F1</text>
  <text class="t-sub"  x="126" y="68">PPTC 5A</text>

  <rect class="comp-pwr" x="116" y="82" width="72" height="32" rx="2"/>
  <text class="t-main" x="126" y="96">D1</text>
  <text class="t-sub"  x="126" y="108">SMAJ30A</text>

  <rect class="comp-pwr" x="116" y="122" width="72" height="46" rx="2"/>
  <text class="t-main" x="126" y="140">Q1</text>
  <text class="t-sub"  x="126" y="153">AO3401A</text>

  <rect class="comp-pwr" x="116" y="176" width="72" height="20" rx="2"/>
  <text class="t-sub"  x="122" y="190">C1 470µF</text>

  <!-- ================= ② DC-DC ================= -->
  <rect class="comp-dcdc" x="220" y="44" width="76" height="54" rx="2"/>
  <text class="t-main" x="228" y="66">U1</text>
  <text class="t-sub"  x="228" y="80">TPS5430</text>
  <text class="t-sub"  x="228" y="92">SOIC-8</text>

  <rect class="comp-dcdc" x="220" y="106" width="52" height="24" rx="2"/>
  <text class="t-sub" x="226" y="122">C4 10µF</text>

  <rect class="comp-dcdc" x="220" y="138" width="52" height="18" rx="2"/>
  <text class="t-sub" x="226" y="151">C3 10nF</text>

  <rect class="comp-dcdc" x="220" y="164" width="64" height="26" rx="2"/>
  <text class="t-sub" x="224" y="181">R2/R3 分压</text>

  <rect class="comp-dcdc" x="304" y="44" width="84" height="84" rx="4"/>
  <text class="t-main" x="318" y="84">L1</text>
  <text class="t-sub"  x="316" y="98">15µH / 3A</text>

  <rect class="comp-dcdc" x="304" y="138" width="84" height="34" rx="2"/>
  <text class="t-sub" x="312" y="159">D2 B340A</text>

  <rect class="comp-dcdc" x="400" y="44" width="58" height="76" rx="3"/>
  <text class="t-main" x="410" y="80">C5</text>
  <text class="t-sub"  x="406" y="94">220µF</text>

  <rect class="comp-dcdc" x="400" y="130" width="58" height="24" rx="2"/>
  <text class="t-sub" x="406" y="146">C6 10µF</text>

  <rect class="comp-dcdc" x="400" y="164" width="58" height="24" rx="2"/>
  <text class="t-sub" x="406" y="180">C7 104</text>

  <text class="t-white" x="470" y="70">+5V</text>
  <text class="t-whiteS" x="470" y="84">≥ 2.5 A</text>
  <text class="t-whiteS" x="470" y="98">独立 3.3V</text>
  <text class="t-whiteS" x="470" y="112">不在底板做</text>

  <!-- ================= ③ USB / CH340 ================= -->
  <rect class="comp-com" x="560" y="44" width="96" height="50" rx="2"/>
  <text class="t-main" x="570" y="64">U2</text>
  <text class="t-sub"  x="570" y="78">CH340C</text>
  <text class="t-sub"  x="570" y="90">SOP-16</text>

  <rect class="conn" x="806" y="40" width="74" height="62" rx="4"/>
  <text class="t-main" x="820" y="68">J15</text>
  <text class="t-sub"  x="814" y="82">Type-C</text>
  <text class="t-whiteS" x="800" y="112">贴板边</text>

  <rect class="comp-pwr" x="700" y="108" width="52" height="22" rx="2"/>
  <text class="t-sub" x="704" y="122">D9 B340A</text>
  <text class="t-whiteS" x="700" y="142">VBUS 隔离</text>

  <rect class="comp" x="560" y="108" width="62" height="22" rx="2"/>
  <text class="t-sub" x="566" y="123">D3 电源灯</text>

  <rect class="comp" x="560" y="140" width="62" height="22" rx="2"/>
  <text class="t-sub" x="566" y="155">R ×2 22Ω</text>

  <text class="t-whiteS" x="668" y="70">CH340 直连</text>
  <text class="t-whiteS" x="668" y="84">USART1</text>
  <text class="t-whiteS" x="668" y="98">PA9 / PA10</text>

  <!-- ================= 核心板座 ================= -->
  <rect class="core" x="227" y="214" width="426" height="186" rx="6"/>

  <!-- 上排 20 脚 -->
  <circle class="corepad" cx="248" cy="246" r="5"/>
  <circle class="corepad" cx="268" cy="246" r="5"/>
  <circle class="corepad" cx="289" cy="246" r="5"/>
  <circle class="corepad" cx="309" cy="246" r="5"/>
  <circle class="corepad" cx="329" cy="246" r="5"/>
  <circle class="corepad" cx="350" cy="246" r="5"/>
  <circle class="corepad" cx="370" cy="246" r="5"/>
