  <!-- ================= 图例 ================= -->
  <g transform="translate(0,740)">
    <rect class="comp-pwr" x="0" y="-10" width="18" height="12" rx="2"/>
    <text class="dimtxt" x="24" y="0">电源/安全</text>

    <rect class="comp-dcdc" x="106" y="-10" width="18" height="12" rx="2"/>
